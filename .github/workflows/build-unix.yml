# Builds Likhon for Linux (.deb and .rpm) and macOS (.dmg, universal, unsigned). Run by hand, or on a v* tag.
# Linux and macOS are independent: one failing does not stop the other. The Mac runner is an Intel one
# (macos-15-intel): GitHub does not offer this organization the Apple Silicon runner. build-mac.sh still makes the
# universal app by cross-building the arm64 half with the Rust and Swift targets.
name: Build Linux and macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p likhon-engine -p likhon-store -p likhon-ffi
        working-directory: Source
      - name: UniJoy must not be in the source or the library
        run: node Source/scripts/check-unijoy-excluded.mjs

  test-macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p likhon-engine -p likhon-store -p likhon-ffi
        working-directory: Source

  linux-deb:
    needs: test-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libibus-1.0-dev ibus ibus-gtk3 xvfb xdotool dbus-x11 python3-gi gir1.2-gtk-3.0 dpkg-dev
      - name: Build the engine
        run: bash ./build.sh
        working-directory: Linux
      - name: Typing test through a real ibus-daemon
        run: bash ./tests/headless-typing.sh
        working-directory: Linux
      - name: Build the .deb
        run: bash ./build-deb.sh
        working-directory: Linux
      - name: UniJoy must not be in the package
        run: "! dpkg-deb -c Product/Linux/*.deb | grep -i unijoy"
      - uses: actions/upload-artifact@v4
        with:
          name: likhon-linux
          path: Product/Linux/

  linux-rpm:
    needs: test-linux
    runs-on: ubuntu-24.04
    container: fedora:44
    permissions:
      contents: read
    steps:
      - name: Install git
        run: dnf -y install git ca-certificates
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Packages
        run: dnf -y install gcc make pkgconf-pkg-config ibus-devel ibus ibus-gtk3 xorg-x11-server-Xvfb xdotool dbus-x11 python3-gobject gtk3 setxkbmap rust cargo rpm-build redhat-rpm-config
      - name: Build the engine
        run: bash ./build.sh
        working-directory: Linux
      - name: Typing test through a real ibus-daemon
        run: bash ./tests/headless-typing.sh
        working-directory: Linux
      - name: Build the RPM
        run: bash ./build-rpm.sh
        working-directory: Linux
      - name: UniJoy must not be in the package
        run: |
          rpm -qlp Product/Linux/*.rpm > /tmp/rpm-files.txt
          ! grep -i unijoy /tmp/rpm-files.txt
      - name: Install the RPM and run the installed test
        working-directory: Linux
        run: |
          dnf -y install ../Product/Linux/*.rpm
          LIKHON_INSTALLED=1 bash tests/headless-typing.sh
          dnf -y remove -y ibus-likhon
          ! rpm -q ibus-likhon
          test ! -e /usr/share/ibus/component/likhon.xml
      - uses: actions/upload-artifact@v4
        with:
          name: likhon-linux-rpm
          path: Product/Linux/

  macos-dmg:
    needs: test-macos
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the universal app, package and disk image
        run: bash ./build-mac.sh
        working-directory: Mac
      - uses: actions/upload-artifact@v4
        with:
          name: likhon-macos
          path: Product/Mac/
