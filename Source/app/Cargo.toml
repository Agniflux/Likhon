[package]
name = "likhon"
description = "likhon.exe: agent, settings, and update helper in one file (Desktop/CLAUDE.md, section 1)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "likhon"
path = "src/main.rs"

[dependencies]
likhon-engine = { path = "../crates/likhon-engine", default-features = false }
likhon-store = { path = "../crates/likhon-store" }
serde_json = "1.0.154"
# Unzipping library font zips (online.rs): a small pure-Rust deflate decoder (MIT/Apache-2.0/Zlib).
miniz_oxide = "0.8"
# Top bar drawing: Direct2D and DirectWrite (Desktop/CLAUDE.md section 4; DirectWrite shapes Bangla conjuncts).
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_System_Variant"] }
windows-numerics = "0.3"
# Settings window only (likhon.exe --settings): the web view and window libraries Tauri 2 is built on.
wry = { version = "0.57.0", default-features = false, features = ["os-webview"] }
tao = { version = "0.37.1", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus", "Win32_System_Console", "Win32_Security", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_Globalization", "Win32_UI_Controls_Dialogs", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_System_SystemInformation"] }

[build-dependencies]
embed-resource = "3.0.12"
serde_json = "1.0.154"
# Top bar drawing: Direct2D and DirectWrite (Desktop/CLAUDE.md section 4; DirectWrite shapes Bangla conjuncts).
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common"] }
windows-numerics = "0.3"
sha1_smol = "1.0.1"
# Deflates the embedded text-service DLLs (app/src/winkb.rs inflates them with the same crate).
miniz_oxide = "0.8"
