# likhon_tsf.dll: Likhon as a Windows text service (TSF), listed under the Bangla (Bangladesh) language in Settings ›
# Time & language and in Win+Space (Desktop/CLAUDE.md 5, "Text-service path"; milestone M3). Built for x64 and x86
# (32-bit apps load the 32-bit DLL). Thin: no WebView, no network; it reads settings.json, the dictionary and My words
# (SQLite, read-only) and types with the same engine as likhon.exe.
[package]
name = "likhon-tsf"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "likhon_tsf"
crate-type = ["cdylib", "rlib"]

[dependencies]
likhon-engine = { path = "../crates/likhon-engine", default-features = false }
# The dictionary and My words, read-only, for the keyboard's own suggestion window (owner decision 2026-10-24).
likhon-store = { path = "../crates/likhon-store" }
serde_json = "1.0.154"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_TextServices", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_Ole", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Variant"] }

[build-dependencies]
embed-resource = "3.0.12"
